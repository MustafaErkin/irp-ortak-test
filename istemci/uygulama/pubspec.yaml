name: irp_uygulama
description: "Sibernetik IRP Android ve web uygulama iskeleti."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
dependencies:
  irp_cekirdek:
    path: ../irp_cekirdek
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  idb_shim: ^2.11.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  image: ^4.12.0
  qr: ^4.0.0
  connectivity_plus: ^7.3.2
  desktop_drop: ^0.8.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_schema: ^5.2.2
  fake_async: ^1.3.3
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.4
flutter:
  uses-material-design: true
  assets:
    - test/fikstur/telefon.json
    - test/fikstur/web.json
    - test/fikstur/yonetim.json
    - assets/eylem_semalari.json
    - assets/gosterim.json
    - assets/cizimler/
  fonts:
    - family: IRP
      fonts:
        - asset: assets/fontlar/roboto-regular.ttf
        - asset: assets/fontlar/roboto-bold.ttf
          weight: 700
