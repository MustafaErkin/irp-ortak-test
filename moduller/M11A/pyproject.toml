[project]
name = "m11a"
version = "0.1.1"
description = "Sibernetik IRP · M1.1A Sipariş alma ve muhasebeye devir"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "psycopg>=3.1",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["m11a*"]

[tool.pytest.ini_options]
testpaths = ["testler"]
pythonpath = ["."]
